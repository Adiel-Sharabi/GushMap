<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer - Carmatz 1</title>

    <!-- Google Model Viewer -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: #fff;
            width: 100vw;
            height: 100vh;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .viewer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }

        /* Back Button */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
        }

        /* Floating Reset Button */
        .reset-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
        }

        .reset-btn:active {
            transform: translateX(-50%) translateY(0);
        }

        /* Compact info display */
        .info-overlay {
            position: absolute;
            bottom: 30px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            max-width: 200px;
        }

        .info-overlay div {
            margin: 4px 0;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            color: white;
            font-size: 16px;
            margin-top: 10px;
        }

        .loading-progress {
            color: #667eea;
            font-size: 14px;
            margin-top: 5px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .back-btn {
                top: 10px;
                left: 10px;
                padding: 10px 16px;
                font-size: 13px;
            }

            .reset-btn {
                bottom: 20px;
                padding: 14px 28px;
                font-size: 15px;
            }

            .info-overlay {
                display: none;
            }

            /* Hide camera position on mobile for cleaner view */
            .camera-position {
                display: none !important;
            }
        }

        /* Camera position display - desktop only */
        .camera-position {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #00ff00;
            border: 1px solid rgba(0, 255, 0, 0.2);
            z-index: 100;
        }

        .camera-position div {
            margin: 3px 0;
        }

        /* Location Title */
        .location-title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            z-index: 100;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        /* Cache Control Panel */
        .cache-panel {
            position: absolute;
            bottom: 30px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cache-status {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cache-status span {
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        #cacheSize {
            color: #00ff00;
        }

        .clear-cache-btn {
            padding: 8px 16px;
            background: rgba(255, 50, 50, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .clear-cache-btn:hover:not(:disabled) {
            background: rgba(255, 50, 50, 1);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .clear-cache-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .cache-panel {
                bottom: 80px;
                left: 10px;
                padding: 10px 12px;
                font-size: 10px;
            }

            .cache-status span {
                font-size: 10px;
            }

            .clear-cache-btn {
                padding: 6px 12px;
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="viewer-container">
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
                <div class="loading-text">Loading 3D Model...</div>
                <div class="loading-progress" id="loadingProgress">Preparing...</div>
            </div>

            <model-viewer
                id="modelViewer"
                camera-controls
                shadow-intensity="1"
                environment-image="neutral"
                exposure="1"
                shadow-softness="1"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-orbit="0deg 150deg 3m"
                min-camera-orbit="0deg 120deg 1m"
                max-camera-orbit="0deg 180deg 10m"
                orientation="0deg 0deg 0deg"
                interaction-prompt="auto">
            </model-viewer>
        </div>

        <!-- Back Button -->
        <a href="index.html" class="back-btn">← Back to Menu</a>

        <!-- Location Title -->
        <div class="location-title">Carmatz 1</div>

        <!-- Floating Reset Button -->
        <button class="reset-btn" onclick="resetCamera()">↻ Reset View</button>

        <!-- Camera Position Display (Desktop Only) -->
        <div class="camera-position">
            <div><strong>Phi:</strong> <span id="cameraPhi">150°</span></div>
            <div><strong>Distance:</strong> <span id="cameraDistance">3m</span></div>
            <div><strong>Rotation:</strong> <span id="mapRotation">0°</span></div>
        </div>

        <!-- Info Overlay (Desktop Only) -->
        <div class="info-overlay">
            <div>🖱️ Drag: Spin map</div>
            <div>🖱️ Right-click: Pan</div>
            <div>🔍 Scroll: Zoom</div>
        </div>

        <!-- Cache Control Panel -->
        <div class="cache-panel">
            <div class="cache-status">
                <span id="cacheStatus">Cache: Checking...</span>
                <span id="cacheSize"></span>
            </div>
            <button class="clear-cache-btn" onclick="clearModelCache()" id="clearCacheBtn" disabled>Clear Cache</button>
        </div>
    </div>

    <script>
        const modelViewer = document.getElementById('modelViewer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingProgress = document.getElementById('loadingProgress');

        // Hide loading overlay when model loads
        modelViewer.addEventListener('load', () => {
            loadingOverlay.classList.add('hidden');
        });

        // Reset camera to default position (overhead view)
        function resetCamera() {
            // Reset camera orbit and position
            modelViewer.cameraOrbit = '0deg 150deg 3m';
            modelViewer.fieldOfView = '45deg';

            // Reset camera target (pan position to center)
            modelViewer.cameraTarget = '0m 0m 0m';

            // Reset map rotation (X-axis)
            currentRotationZ = 0;
            modelViewer.orientation = '0deg 0deg 0deg';
            document.getElementById('mapRotation').textContent = '0°';

            // Update display
            updateCameraPosition();

            // Add a brief visual feedback
            const viewer = document.querySelector('.viewer-container');
            viewer.style.transform = 'scale(0.98)';
            setTimeout(() => {
                viewer.style.transform = 'scale(1)';
            }, 200);
        }

        // Add smooth transition for viewer container
        document.querySelector('.viewer-container').style.transition = 'transform 0.2s ease';

        // Update camera position display in real-time
        function updateCameraPosition() {
            const orbit = modelViewer.getCameraOrbit();
            const target = modelViewer.getCameraTarget();

            // Update spherical coordinates (phi, radius)
            document.getElementById('cameraPhi').textContent = Math.round(orbit.phi * 180 / Math.PI) + '°';
            document.getElementById('cameraDistance').textContent = orbit.radius.toFixed(2) + 'm';
        }

        // Update position on camera change
        modelViewer.addEventListener('camera-change', updateCameraPosition);

        // Initial update when model loads
        modelViewer.addEventListener('load', () => {
            console.log('Model loaded successfully');
            updateCameraPosition();
        });

        // Handle errors
        modelViewer.addEventListener('error', (event) => {
            console.error('Error loading model:', event);
            loadingProgress.textContent = 'Error loading model';
            loadingProgress.style.color = '#f5576c';
        });

        // Custom rotation handling - spin model on horizontal drag
        let isDragging = false;
        let startX = 0;
        let currentRotationZ = 0;

        modelViewer.addEventListener('mousedown', (e) => {
            // Only handle left mouse button (not right-click for panning)
            if (e.button === 0) {
                isDragging = true;
                startX = e.clientX;
            }
        });

        modelViewer.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - startX;
            startX = e.clientX;

            // Rotate model around X-axis (vertical axis for this orthophoto orientation)
            // Positive to make drag feel natural (drag right = rotate right)
            currentRotationZ += deltaX * 0.5;

            // Update model orientation - X-axis rotation for map spinning
            modelViewer.orientation = `${currentRotationZ}deg 0deg 0deg`;

            // Update display
            document.getElementById('mapRotation').textContent = Math.round(currentRotationZ) + '°';
        });

        modelViewer.addEventListener('mouseup', () => {
            isDragging = false;
        });

        modelViewer.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // Touch gestures handled natively by model-viewer:
        // - Single touch: orbit camera
        // - Two fingers: pan
        // - Pinch: zoom

        // ========================================
        // CACHE MANAGEMENT
        // ========================================
        const CACHE_NAME = 'carmatz-model-cache-v1';
        const MODEL_URL = window.location.origin + window.location.pathname.replace('carmatz1.html', '') + 'carmatz1.glb';
        let currentBlobURL = null;

        // Format bytes to human-readable size
        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        // Update cache status display
        function updateCacheStatus(isCached, size = 0) {
            const statusEl = document.getElementById('cacheStatus');
            const sizeEl = document.getElementById('cacheSize');
            const clearBtn = document.getElementById('clearCacheBtn');

            if (isCached) {
                statusEl.textContent = 'Cache: Active ✓';
                statusEl.style.color = '#00ff00';
                sizeEl.textContent = 'Size: ' + formatBytes(size);
                clearBtn.disabled = false;
            } else {
                statusEl.textContent = 'Cache: Not cached';
                statusEl.style.color = '#ffaa00';
                sizeEl.textContent = '';
                clearBtn.disabled = true;
            }
        }

        // Load model from cache or network
        async function loadModel() {
            try {
                const cache = await caches.open(CACHE_NAME);
                const cachedResponse = await cache.match(MODEL_URL);

                let blob;
                let fromCache = false;

                if (cachedResponse) {
                    // Load from cache
                    console.log('✓ Loading model from cache');
                    blob = await cachedResponse.blob();
                    fromCache = true;
                    updateCacheStatus(true, blob.size);
                } else {
                    // Fetch from network and cache it
                    console.log('→ Fetching model from network...');
                    updateCacheStatus(false);

                    const response = await fetch(MODEL_URL);
                    blob = await response.clone().blob();

                    // Cache the response
                    await cache.put(MODEL_URL, response);
                    console.log('✓ Model cached for future use');
                    updateCacheStatus(true, blob.size);
                }

                // Create blob URL and set it as model source
                currentBlobURL = URL.createObjectURL(blob);
                modelViewer.src = currentBlobURL;

                console.log(fromCache ? '✓ Model loaded from cache' : '✓ Model loaded from network and cached');
            } catch (error) {
                console.error('Error loading model:', error);
                document.getElementById('cacheStatus').textContent = 'Cache: Error';
                // Fallback to direct URL
                modelViewer.src = MODEL_URL;
            }
        }

        // Clear the cache
        async function clearModelCache() {
            try {
                const deleted = await caches.delete(CACHE_NAME);
                if (deleted) {
                    console.log('✓ Cache cleared successfully');

                    // Revoke old blob URL if exists
                    if (currentBlobURL) {
                        URL.revokeObjectURL(currentBlobURL);
                        currentBlobURL = null;
                    }

                    // Show user feedback
                    const statusEl = document.getElementById('cacheStatus');
                    statusEl.textContent = 'Cache: Clearing...';
                    statusEl.style.color = '#ffaa00';

                    // Reload the page to fetch fresh model
                    setTimeout(() => {
                        location.reload();
                    }, 500);
                }
            } catch (error) {
                console.error('Clear cache error:', error);
            }
        }

        // Initialize model loading
        loadModel();
    </script>
</body>
</html>
